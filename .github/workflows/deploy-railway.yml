name: Deploy Railway

# Single environment: Railway project `greensentinel`, environment `production`.
# Deploys on push to main and manual dispatch. No PR previews.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - ".github/workflows/deploy-railway.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/deploy-railway.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-railway
  cancel-in-progress: false

jobs:
  validate-config:
    name: Validate Infrastructure Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Docker Compose Configuration
        run: docker compose config

  deploy-production:
    name: Deploy Backend to Railway (production)
    needs: [validate-config]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @railway/cli

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Database migration
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          uv run --python 3.12 --with "psycopg[binary]>=3.2" --with python-dotenv \
            python scripts/migrate_postgres.py --database-url "$DATABASE_URL"

      - name: Deploy code to Railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          bash scripts/railway_deploy_code.sh \
            --service "${{ secrets.RAILWAY_SERVICE_ID }}" \
            --project "${{ secrets.RAILWAY_PROJECT_ID }}" \
            --environment "${{ secrets.RAILWAY_ENVIRONMENT_ID }}" \
            --message "CI/CD: production release ${GITHUB_SHA::7}"

      - name: Health probe
        env:
          PROD_API_URL: ${{ vars.RAILWAY_PRODUCTION_URL || 'https://greensentinel-backend-production.up.railway.app' }}
        run: |
          for i in {1..24}; do
            if curl -s -f "${PROD_API_URL%/}/health" >/dev/null; then
              echo "Production API healthy: ${PROD_API_URL}"
              exit 0
            fi
            sleep 5
          done
          echo "Production health check timed out" && exit 1
