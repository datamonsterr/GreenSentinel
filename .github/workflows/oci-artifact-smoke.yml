name: OCI artifact smoke

on:
  pull_request:
    paths:
      - ".github/actions/oci-*/**"
      - "tests/unit/test_oci_artifacts.py"
      - ".github/workflows/oci-artifact-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  round-trip:
    # Hosted account billing blocks ubuntu-latest; use the existing Linux CI fleet.
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep Docker-owned leftovers in the shared workspace outside this checkout.
          path: oci-artifact-smoke
      - name: Create deterministic artifact
        run: |
          mkdir -p "$RUNNER_TEMP/oci-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/input/.next-gis"
          printf 'oci-smoke:%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/oci-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/input/.next-gis/manifest.txt"
          printf hidden > "$RUNNER_TEMP/oci-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/input/.next-gis/.hidden"
          mkdir "$RUNNER_TEMP/oci-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/input/.next-gis/cache"
          printf 'cache\n' > "$RUNNER_TEMP/oci-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/input/.next-gis/cache/ignored.txt"
      - name: Upload smoke artifact
        uses: ./oci-artifact-smoke/.github/actions/oci-upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.OCI_REGION || secrets.OCI_REGION }}
          AWS_ENDPOINT_URL: ${{ vars.OCI_S3_ENDPOINT || secrets.OCI_S3_ENDPOINT }}
          OCI_S3_BUCKET: ${{ vars.OCI_S3_BUCKET }}
        with:
          force-install-cli: true
          name: oci-smoke
          path: ${{ runner.temp }}/oci-smoke-${{ github.run_id }}-${{ github.run_attempt }}/input/.next-gis
          if-no-files-found: error
          include-hidden-files: true
          exclude: cache
      - name: Download smoke artifact
        id: download
        uses: ./oci-artifact-smoke/.github/actions/oci-download
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.OCI_REGION || secrets.OCI_REGION }}
          AWS_ENDPOINT_URL: ${{ vars.OCI_S3_ENDPOINT || secrets.OCI_S3_ENDPOINT }}
          OCI_S3_BUCKET: ${{ vars.OCI_S3_BUCKET }}
        with:
          force-install-cli: true
          name: oci-smoke
          path: ${{ runner.temp }}/oci-smoke-${{ github.run_id }}-${{ github.run_attempt }}/output
      - name: Compare smoke artifact
        if: steps.download.outputs.downloaded == 'true'
        run: |
          cmp "$RUNNER_TEMP/oci-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/input/.next-gis/manifest.txt" "$RUNNER_TEMP/oci-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/output/manifest.txt"
          cmp "$RUNNER_TEMP/oci-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/input/.next-gis/.hidden" "$RUNNER_TEMP/oci-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/output/.hidden"
          test ! -e "$RUNNER_TEMP/oci-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/output/cache/ignored.txt"
      - name: Clean smoke fixture
        if: always()
        run: rm -rf "$RUNNER_TEMP/oci-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
