name: Deploy Vercel

on:
  push:
    branches: [main]
    paths:
      - "src/webapp/**"
      - "scripts/railway_pr.py"
      - "scripts/auth_config.py"
      - "scripts/deployment_policy.py"
      - "scripts/vercel_deploy.sh"
      - "scripts/vercel_project.py"
      - "scripts/authorize_preview.sh"
      - ".github/workflows/deploy-vercel.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_call:
    inputs:
      railway_ready:
        description: "Caller completed exact-head Railway provisioning and health checks"
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - production
          - all

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

jobs:
  classify-pr:
    name: Classify PR Scope
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
    steps:
      - name: Clean root-owned Docker volumes from previous runs
        run: |
          if [ -d "$GITHUB_WORKSPACE" ] && command -v docker >/dev/null 2>&1; then
            docker run --rm -v "$GITHUB_WORKSPACE:/target" alpine sh -c '
              rm -rf /target/src/webapp/node_modules /target/src/webapp/test-results
              chown -R '"$(id -u):$(id -g)"' /target
            '
          fi
          if [ -d "$GITHUB_WORKSPACE/data" ]; then
            if command -v docker >/dev/null 2>&1; then
              docker run --rm -v "$GITHUB_WORKSPACE/data:/target" alpine \
                sh -c "rm -rf /target/*" || true
            fi
            rm -rf "$GITHUB_WORKSPACE/data" || true
          fi
      - uses: actions/checkout@v7
      - name: Classify PR
        id: classify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/deployment_policy.py classify --pr ${{ github.event.pull_request.number }}

  # ==========================================
  # 1. PULL REQUEST / PREVIEW ENVIRONMENT
  # ==========================================
  deploy-preview:
    name: Deploy PR Preview to Vercel
    needs: [classify-pr]
    # Ready-tier only: no Vercel preview for drafts.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      (inputs.railway_ready == true ||
      (needs.classify-pr.outputs.frontend == 'true' && needs.classify-pr.outputs.backend != 'true'))
    runs-on: self-hosted
    outputs:
      preview_url: ${{ steps.vercel-preview.outputs.preview_url }}
      backend_url: ${{ steps.resolve-backend.outputs.backend_url }}
    steps:
      - name: Clean root-owned Docker volumes from previous runs
        run: |
          if [ -d "$GITHUB_WORKSPACE" ] && command -v docker >/dev/null 2>&1; then
            docker run --rm -v "$GITHUB_WORKSPACE:/target" alpine sh -c '
              rm -rf /target/src/webapp/node_modules /target/src/webapp/test-results
              chown -R '"$(id -u):$(id -g)"' /target
            '
          fi
          if [ -d "$GITHUB_WORKSPACE/data" ]; then
            if command -v docker >/dev/null 2>&1; then
              docker run --rm -v "$GITHUB_WORKSPACE/data:/target" alpine \
                sh -c "rm -rf /target/*" || true
            fi
            rm -rf "$GITHUB_WORKSPACE/data" || true
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 11
          dest: ${{ runner.temp }}/pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          cache: true
          cache_dependency_path: src/webapp/pnpm-lock.yaml
      - run: npm install --global vercel@62.2.0

      - name: Setup Railway CLI for scoped preview resolution
        run: npm install --global @railway/cli

      - name: Resolve Backend Preview URL
        id: resolve-backend
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_DEV_SERVICE_ID: ${{ secrets.RAILWAY_DEV_SERVICE_ID || secrets.RAILWAY_SERVICE_ID }}
          IS_BACKEND: ${{ needs.classify-pr.outputs.backend }}
        run: |
          if [ "$IS_BACKEND" = "true" ]; then
            BACKEND_URL=""
            for attempt in {1..24}; do
              if BACKEND_URL="$(python3 scripts/railway_pr.py get-url --pr ${{ github.event.pull_request.number }} --require-preview --head-sha ${{ github.event.pull_request.head.sha }} 2>/dev/null)"; then
                if curl --silent --fail --max-time 5 "${BACKEND_URL%/}/health" >/dev/null; then break; fi
              fi
              BACKEND_URL=""
              sleep 5
            done
            if [ -z "$BACKEND_URL" ]; then
              echo "Scoped Railway PR preview did not become healthy; refusing shared backend fallback." >&2
              exit 1
            fi
          else
            BACKEND_URL="${{ vars.RAILWAY_DEV_URL || 'https://p063-backend-dev.up.railway.app' }}"
            if ! curl --silent --fail --max-time 5 "${BACKEND_URL%/}/health" >/dev/null; then
              echo "Dev backend ${BACKEND_URL} is unreachable." >&2
              exit 1
            fi
            echo "Frontend-only PR: using stable Dev backend ${BACKEND_URL}"
          fi
          echo "backend_url=${BACKEND_URL}" >> $GITHUB_OUTPUT
          echo "Using backend API URL for preview: ${BACKEND_URL}"

      - name: Build and Deploy Preview
        id: vercel-preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_API_URL: ${{ steps.resolve-backend.outputs.backend_url }}
          API_BASE_URL: ${{ steps.resolve-backend.outputs.backend_url }}
        run: |
          vercel pull --yes --environment=preview
          echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}" >> .vercel/.env.preview.local
          echo "API_BASE_URL=${API_BASE_URL}" >> .vercel/.env.preview.local
          if [ -n "${CLERK_SECRET_KEY:-}" ]; then
            echo "CLERK_SECRET_KEY=${CLERK_SECRET_KEY}" >> .vercel/.env.preview.local
          fi
          vercel build
          if [ -d ".git" ]; then mv .git .git_backup; fi
          trap 'if [ -d ".git_backup" ]; then mv .git_backup .git; fi' EXIT
          # .vercel/.env.preview.local is build-time only; the server-side
          # middleware reads runtime env, so pin the scoped backend per deploy.
          deploy_url="$(bash scripts/vercel_deploy.sh \
            -e "API_BASE_URL=${API_BASE_URL}" \
            -e "NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_URL}" \
            -e "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}")"
          echo "preview_url=${deploy_url}" >> $GITHUB_OUTPUT
          echo "Preview deployed: ${deploy_url}"

      - name: Authorize exact Vercel preview origin on scoped Railway backend
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_DEV_SERVICE_ID || secrets.RAILWAY_SERVICE_ID }}
          PREVIEW_URL: ${{ steps.vercel-preview.outputs.preview_url }}
          BACKEND_URL: ${{ steps.resolve-backend.outputs.backend_url }}
          TARGET_ENV: ${{ needs.classify-pr.outputs.backend == 'true' && format('pr-{0}', github.event.pull_request.number) || (vars.RAILWAY_DEV_ENVIRONMENT_ID || 'dev') }}
          AUTH_ENV: ${{ needs.classify-pr.outputs.backend == 'true' && format('pr-{0}', github.event.pull_request.number) || 'dev' }}
        run: |
          npm install -g @railway/cli
          bash scripts/authorize_preview.sh

      - name: Comment Preview Link on Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREVIEW_URL="${{ steps.vercel-preview.outputs.preview_url }}"
          BACKEND_URL="${{ steps.resolve-backend.outputs.backend_url }}"
          printf "🚀 **Vercel Webapp Preview Deployed**\n- **Preview URL:** %s\n- **Linked Backend API:** %s\n" \
            "$PREVIEW_URL" "$BACKEND_URL" > /tmp/vercel_comment.txt
          cat /tmp/vercel_comment.txt >> "$GITHUB_STEP_SUMMARY"
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/vercel_comment.txt || true

  # ==========================================
  # 1b. PR PREVIEW REAL-ACCOUNT E2E (role logins, no fixtures)
  # ==========================================
  preview-real-account-e2e:
    name: Real-Account E2E on PR Preview
    needs: [deploy-preview]
    runs-on: self-hosted
    steps:
      - name: Clean root-owned Docker volumes from previous runs
        run: |
          if [ -d "$GITHUB_WORKSPACE/data" ]; then
            if command -v docker >/dev/null 2>&1; then
              docker run --rm -v "$GITHUB_WORKSPACE/data:/target" alpine \
                sh -c "rm -rf /target/*" || true
            fi
            rm -rf "$GITHUB_WORKSPACE/data" || true
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 11
          dest: ${{ runner.temp }}/pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          cache: true
          cache_dependency_path: src/webapp/pnpm-lock.yaml

      - name: Install webapp dependencies & browsers
        run: |
          cd src/webapp
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium

      - name: Check real-account secrets
        id: creds
        env:
          E2E_ANALYST_PASSWORD: ${{ secrets.E2E_ANALYST_PASSWORD }}
        run: |
          if [ -z "${E2E_ANALYST_PASSWORD:-}" ]; then
            echo "available=false" >> $GITHUB_OUTPUT
            echo "Real-account preview E2E skipped: E2E_* secrets are not set (expected on fork PRs)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> $GITHUB_OUTPUT
          fi

      - name: Run real-account role suites against preview URLs
        id: auth-e2e
        if: steps.creds.outputs.available == 'true'
        env:
          E2E_TARGET_ENV: preview
          RUN_REAL_ACCOUNT_E2E: "true"
          AUTH_E2E_FRONTEND_URL: ${{ needs.deploy-preview.outputs.preview_url }}
          AUTH_E2E_BACKEND_URL: ${{ needs.deploy-preview.outputs.backend_url }}
          E2E_ANALYST_EMAIL: ${{ secrets.E2E_ANALYST_EMAIL }}
          E2E_ANALYST_PASSWORD: ${{ secrets.E2E_ANALYST_PASSWORD }}
          E2E_DRIVER_EMAIL: ${{ secrets.E2E_DRIVER_EMAIL }}
          E2E_DRIVER_PASSWORD: ${{ secrets.E2E_DRIVER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          cd src/webapp
          pnpm test:e2e:auth

      - name: Comment result on Pull Request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ needs.deploy-preview.outputs.preview_url }}
          BACKEND_URL: ${{ needs.deploy-preview.outputs.backend_url }}
          CREDS: ${{ steps.creds.outputs.available }}
          OUTCOME: ${{ steps.auth-e2e.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$CREDS" != "true" ]; then
            printf "⏭️ **Real-account preview E2E skipped**\n- E2E_* secrets are not set (fork PRs have no secret access).\n" > /tmp/auth_e2e_comment.txt
          elif [ "$OUTCOME" = "success" ]; then
            printf "✅ **Real-account preview E2E passed**\n- **Preview URL:** %s\n- **Linked Backend API:** %s\n" \
              "$PREVIEW_URL" "$BACKEND_URL" > /tmp/auth_e2e_comment.txt
          else
            printf "❌ **Real-account preview E2E failed**\n- **Preview URL:** %s\n- **Linked Backend API:** %s\n- **Run:** %s\n" \
              "$PREVIEW_URL" "$BACKEND_URL" "$RUN_URL" > /tmp/auth_e2e_comment.txt
          fi
          cat /tmp/auth_e2e_comment.txt >> "$GITHUB_STEP_SUMMARY"
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/auth_e2e_comment.txt || true

  # ==========================================
  # 2. DEV ENVIRONMENT (Auto trigger on merge to main)
  # ==========================================
  deploy-dev:
    name: Deploy to Dev (p-063-dev.vercel.app)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.target_env == 'dev' || inputs.target_env == 'all'))
    runs-on: self-hosted
    environment: dev
    steps:
      - name: Clean root-owned Docker volumes from previous runs
        run: |
          if [ -d "$GITHUB_WORKSPACE/data" ]; then
            if command -v docker >/dev/null 2>&1; then
              docker run --rm -v "$GITHUB_WORKSPACE/data:/target" alpine \
                sh -c "rm -rf /target/*" || true
            fi
            rm -rf "$GITHUB_WORKSPACE/data" || true
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 11
          dest: ${{ runner.temp }}/pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          cache: true
          cache_dependency_path: src/webapp/pnpm-lock.yaml
      - run: npm install --global vercel@62.2.0

      - name: Build and Deploy to Dev Domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_API_URL: ${{ vars.RAILWAY_DEV_URL || 'https://p063-backend-dev.up.railway.app' }}
          API_BASE_URL: ${{ vars.RAILWAY_DEV_URL || 'https://p063-backend-dev.up.railway.app' }}
        run: |
          vercel pull --yes --environment=preview
          echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}" >> .vercel/.env.preview.local
          echo "API_BASE_URL=${API_BASE_URL}" >> .vercel/.env.preview.local
          if [ -n "${CLERK_SECRET_KEY:-}" ]; then
            echo "CLERK_SECRET_KEY=${CLERK_SECRET_KEY}" >> .vercel/.env.preview.local
          fi
          vercel build
          if [ -d ".git" ]; then mv .git .git_backup; fi
          trap 'if [ -d ".git_backup" ]; then mv .git_backup .git; fi' EXIT
          deploy_url="$(bash scripts/vercel_deploy.sh)"
          python3 scripts/vercel_project.py alias "$deploy_url" "p-063-dev.vercel.app"
          python3 scripts/vercel_project.py alias "$deploy_url" "dev.p-063.vercel.app" || echo "Optional dotted Dev alias unavailable; canonical Dev alias is ready." >&2
          echo "Dev deployed to https://p-063-dev.vercel.app"

  # ==========================================
  # 3. STAGING ENVIRONMENT (staging.p-063.vercel.app - Gated by Approval)
  # ==========================================
  deploy-staging:
    name: Deploy to Staging (staging.p-063.vercel.app)
    if: "github.event_name == 'workflow_dispatch' && (inputs.target_env == 'staging' || inputs.target_env == 'all')"
    runs-on: self-hosted
    environment: staging
    steps:
      - name: Clean root-owned Docker volumes from previous runs
        run: |
          if [ -d "$GITHUB_WORKSPACE/data" ]; then
            if command -v docker >/dev/null 2>&1; then
              docker run --rm -v "$GITHUB_WORKSPACE/data:/target" alpine \
                sh -c "rm -rf /target/*" || true
            fi
            rm -rf "$GITHUB_WORKSPACE/data" || true
          fi
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 11
          dest: ${{ runner.temp }}/pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          cache: true
          cache_dependency_path: src/webapp/pnpm-lock.yaml
      - run: npm install --global vercel@62.2.0

      - name: Build and Deploy to Staging Domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_API_URL: ${{ vars.RAILWAY_STAGING_URL || 'https://p063-backend-staging.up.railway.app' }}
          API_BASE_URL: ${{ vars.RAILWAY_STAGING_URL || 'https://p063-backend-staging.up.railway.app' }}
        run: |
          vercel pull --yes --environment=preview
          echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}" >> .vercel/.env.preview.local
          echo "API_BASE_URL=${API_BASE_URL}" >> .vercel/.env.preview.local
          vercel build
          if [ -d ".git" ]; then mv .git .git_backup; fi
          trap 'if [ -d ".git_backup" ]; then mv .git_backup .git; fi' EXIT
          deploy_url="$(bash scripts/vercel_deploy.sh)"
          python3 scripts/vercel_project.py alias "$deploy_url" "p-063-staging.vercel.app"
          python3 scripts/vercel_project.py alias "$deploy_url" "staging.p-063.vercel.app" || echo "Optional dotted Staging alias unavailable; canonical Staging alias is ready." >&2
          echo "Staging deployed to https://p-063-staging.vercel.app"

  # ==========================================
  # 4. PRODUCTION ENVIRONMENT (p-063.vercel.app - Manual Gated)
  # ==========================================
  deploy-production:
    name: Deploy to Production (p-063.vercel.app - Manual Gated)
    needs: [deploy-staging]
    if: "github.ref == 'refs/heads/main' && !cancelled() && !failure() && github.event_name == 'workflow_dispatch' && (inputs.target_env == 'production' || inputs.target_env == 'all')"
    runs-on: self-hosted
    environment: production
    steps:
      - name: Clean root-owned Docker volumes from previous runs
        run: |
          if [ -d "$GITHUB_WORKSPACE/data" ]; then
            if command -v docker >/dev/null 2>&1; then
              docker run --rm -v "$GITHUB_WORKSPACE/data:/target" alpine \
                sh -c "rm -rf /target/*" || true
            fi
            rm -rf "$GITHUB_WORKSPACE/data" || true
          fi
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 11
          dest: ${{ runner.temp }}/pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          cache: true
          cache_dependency_path: src/webapp/pnpm-lock.yaml
      - run: npm install --global vercel@62.2.0

      - name: Build and Deploy to Production Domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_API_URL: ${{ vars.RAILWAY_PRODUCTION_URL || 'https://p063-backend-production.up.railway.app' }}
          API_BASE_URL: ${{ vars.RAILWAY_PRODUCTION_URL || 'https://p063-backend-production.up.railway.app' }}
        run: |
          vercel pull --yes --environment=production
          echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}" >> .vercel/.env.production.local
          echo "API_BASE_URL=${API_BASE_URL}" >> .vercel/.env.production.local
          vercel build --prod
          if [ -d ".git" ]; then mv .git .git_backup; fi
          trap 'if [ -d ".git_backup" ]; then mv .git_backup .git; fi' EXIT
          deploy_url="$(bash scripts/vercel_deploy.sh --prod)"
          python3 scripts/vercel_project.py alias "$deploy_url" "p-063.vercel.app"
          echo "Production deployed to https://p-063.vercel.app"
