name: Deploy Vercel

# Single environment: Vercel production. Independent of the Railway job.

on:
  push:
    branches: [main]
    paths:
      - "src/webapp/**"
      - ".github/workflows/deploy-vercel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vercel
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy Webapp to Vercel (production)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_API_URL: ${{ vars.RAILWAY_PRODUCTION_URL || 'https://greensentinel-backend-production.up.railway.app' }}
      API_BASE_URL: ${{ vars.RAILWAY_PRODUCTION_URL || 'https://greensentinel-backend-production.up.railway.app' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/webapp/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/webapp/pnpm-lock.yaml
      - run: npm install --global vercel@62.2.0

      - name: Pull, build and deploy
        working-directory: src/webapp
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}" >> .vercel/.env.production.local
          echo "API_BASE_URL=${API_BASE_URL}" >> .vercel/.env.production.local
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
