name: Download OCI artifact
description: Download and extract a CI artifact from OCI Object Storage through its S3 API
inputs:
  force-install-cli: {description: Install the pinned AWS CLI in temporary storage even when aws is available, required: false, default: "false"}
  name: {description: Artifact name, required: true}
  path: {description: Destination directory, required: true}
outputs:
  downloaded:
    description: Whether the artifact was downloaded (false when credentials are unavailable)
    value: ${{ steps.transfer.outputs.downloaded }}
runs:
  using: composite
  steps:
    - name: Download artifact from OCI
      id: transfer
      shell: bash
      env:
        OCI_ACCESS_KEY: ${{ env.AWS_ACCESS_KEY_ID }}
        OCI_SECRET_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
        OCI_REGION: ${{ env.AWS_DEFAULT_REGION }}
        OCI_ENDPOINT: ${{ env.AWS_ENDPOINT_URL }}
        OCI_BUCKET: ${{ env.OCI_S3_BUCKET }}
        OCI_FORCE_INSTALL: ${{ inputs.force-install-cli }}
        OCI_NAME: ${{ inputs.name }}
        OCI_PATH: ${{ inputs.path }}
      run: bash "${{ github.action_path }}/download.sh"
