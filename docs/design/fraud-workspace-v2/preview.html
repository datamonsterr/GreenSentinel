const params=new URLSearchParams(location.search); let locale=params.get('lang')==='vi'?'vi':'en',tab='overview',stage='hidden',judgment='',claimed=false,busy=false,scenario='success',notice='',editWorkflow=false,workflowValue='',rationale={},selectedCase=0,decision='approve';const names=['Nguyễn Văn An','Trần Minh Trọng','Phạm Hoàng Long','Vũ Quốc Huy'];const plates=['29E-123.45','30F-678.90','51G-445.21','30G-552.39'];const tabs=['overview','trip','maps','customer','driver','finalization'];const t=k=>copy[locale][k];const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const b=(key,action,cls='')=>`<button class="${cls}" data-action="${action}">${t(key)}</button>`;const field=(key,value)=>`<label class="field"><span>${t(key)}</span><textarea data-rationale="${key}">${esc(rationale[key]??value)}</textarea></label>`;
function tripline(){return `<button class="tripline" data-tab="trip" aria-label="${t('triptitle')}"><span class="route" title="${t('start')}: Lê Lai → ${t('pickup')}: Bến Thành → ${t('destination')}: Tân Sơn Nhất">${t('start')}: Lê Lai → ${t('pickup')}: Bến Thành → Tân Sơn Nhất</span><span class="badge amber">${t('coming')}</span><span class="badge">${t('match')}</span><strong>185.000 ₫</strong><span aria-hidden="true">›</span></button>`}
function overview(){return `<div class="row"><div class="grow">${tripline()}</div><button data-action="claim" class="small" ${claimed||busy?'disabled':''}>${busy?t('claiming'):claimed?t('owned'):t('claim')}</button></div><section class="section"><div class="eyeline"><span class="badge green">${t('facts')}</span></div><h1>${t('brief')}</h1><p>${t('brieftext')}</p><p class="muted small">${t('briefsub')}</p><div class="evidence"><button data-tab="maps">↗ ${t('telemetry')}</button><button data-tab="driver">↗ ${t('statement')}</button></div></section><section class="section pillar"><div class="marker" aria-hidden="true">◇</div><div><h2>${t('motivation')}</h2><p>${t('motivetext')}</p><div class="unknown small">${t('motiveunknown')}</div><p class="muted small" style="margin-top:10px">${t('motivehelp')}</p></div></section><section class="section pillar"><div class="marker" aria-hidden="true">?</div><div><h2>${t('willingness')}</h2><p>${t('willtext')}</p><div class="unknown small">${t('willunknown')}</div><button class="link" style="margin-top:9px" data-tab="driver">${t('willaction')} ↗</button></div></section><p class="footnote">${t('overviewfoot')}</p>`}
function finalization(){return `<p class="muted small">${t('finalintro')}</p><section class="section"><div class="row between"><h2 style="margin:0">${t('workflow')}</h2>${b('edit','workflow','quiet small')}</div><p class="muted small" style="margin-top:7px">${t('workflowhint')}</p><span class="badge amber">${t('demoworkflow')}</span><div class="workflow"><span>${t('route')}</span>›<span>${t('traffic')}</span>›<span>${t('explanation')}</span></div>${editWorkflow?`<label class="field"><span>${t('workflowlabel')}</span><textarea id="workflow-input">${esc(workflowValue||[t('route'),t('traffic'),t('explanation')].join('\n'))}</textarea></label>${b('save','save-workflow','small')}`:workflowValue?`<p class="small workflow-edit">${esc(workflowValue).replaceAll('\n',' → ')}</p>`:''}</section>${stage==='hidden'?`<div class="gated"><h2>${t('banner')}</h2><p class="muted small">${t('bannertext')}</p>${b('reveal','reveal','primary')}</div>`:stage==='judgment'?`<div class="gated"><h2>${t('independent')}</h2><p class="muted small">${t('independenthint')}</p><div class="judgments">${['fraud','notfraud','uncertain'].map(k=>`<label><input type="radio" name="judgment" value="${k}" ${judgment===k?'checked':''}>${t(k)}</label>`).join('')}</div><label class="field"><span>${t('judgmentnote')}</span><textarea id="independent-note" placeholder="${t('judgmentplaceholder')}">${esc(rationale.independent||'')}</textarea></label><button data-action="submit-judgment" class="primary" ${!judgment?'disabled':''}>${t('submitjudgment')}</button></div>`:`<div class="notice small">✓ ${t('savedjudgment')} <strong>${t(judgment)}</strong></div><div class="result"><div class="result-head row between"><div><div class="row wrap"><h2 style="margin:0">${t('aiconclusion')}</h2><span class="badge amber">${t('mock')}</span></div><p style="margin:5px 0 0">${t('classification')}</p></div><div style="text-align:right"><div class="result-score">78%</div><div class="hint">${t('confidence')}</div></div></div><div class="result-body small"><p class="muted">${t('scorehint')}</p><p><strong>${t('errorlabel')}:</strong> ${t('errortext')}</p></div></div><h2>${t('finaldecision')}</h2><p class="muted small">${t('rationalenote')}</p><div class="rationale-grid">${field('facts',t('behaviornote'))}${field('motivation',t('motivenote'))}${field('willingness',t('willnote'))}${field('analystnotes','')}</div><label class="field"><span>${t('decision')}</span><select id="decision">${['approve','rejectfinal','request'].map(k=>`<option value="${k}" ${decision===k?'selected':''}>${t(k)}</option>`).join('')}</select></label><div class="submit-row">${!claimed?b('claim','claim','small'):''}<button data-action="submit" class="primary" ${!claimed?'disabled':''}>${t('submit')}</button></div>`}`}
function other(){if(tab==='trip')return `<h1>${t('triptitle')}</h1><p class="muted small">TRP-8921 · 14:32</p>${[['firstlocation','Lê Lai'],['pickup','Bến Thành'],['destination','Tân Sơn Nhất'],['fare','185.000 ₫'],['status',t('coming')],['matching',t('match')]].map(([k,v])=>`<div class="data-row"><span class="muted">${t(k)}</span><strong>${v}</strong></div>`).join('')}<section class="section"><h2>${t('timeline')}</h2><p>14:32:00 — ${t('accepted')}</p><p>14:33:06 — ${t('waiting')}</p><p>14:36:12 — ${t('observed')}</p><button data-tab="maps" class="primary">${t('analytics')}</button></section>`;
if(tab==='maps')return `<h1>${t('analytics')}</h1><div class="map"><svg viewBox="0 0 600 270" role="img" aria-label="${t('mapdemo')}"><g stroke="white" stroke-width="17"><path d="M0 40H600M0 120H600M0 210H600M80 0V270M240 0V270M430 0V270"/><path d="M0 250L580 0"/></g><path d="M80 220V120H240V40H430V105" stroke="#047857" stroke-width="5" fill="none" stroke-dasharray="7 4"/><circle cx="80" cy="220" r="8" fill="#047857"/><circle cx="240" cy="120" r="8" fill="#d97706"/><circle cx="430" cy="105" r="8" fill="#334155"/></svg><div class="map-label">${t('mapdemo')}</div></div><div class="metric-grid"><div class="metric"><b>18 m</b><span>${t('movement')}</span></div><div class="metric"><b>4:12</b><span>${t('duration')}</span></div></div><details class="tool"><summary>${t('sensor')}</summary><p>GPS: ± 8 m</p></details><details class="tool"><summary>${t('trafficpending')}</summary><p>${t('unknown')}</p></details>`;
if(tab==='customer')return `<h1>${t('customerfeedback')}</h1><blockquote class="customer-quote">${t('customertext')}</blockquote><div class="unknown"><h3>${t('rating')}</h3><p class="muted small">${t('ratingunknown')}</p></div><section class="section"><h2>${t('conversation')}</h2><div class="tool"><strong>${t('customer')} · 14:34</strong><p>${t('customerline')}</p></div><div class="tool"><strong>${t('driver')} · 14:35</strong><p>${t('driverline')}</p></div></section>`;
return `<h1>${t('driverprofile')}</h1><p>${names[selectedCase]} <span class="muted">· ${plates[selectedCase]}</span></p><div class="metric-grid">${[['4.8 / 5','meanrating'],['94%','acceptance'],['2.3%','cancellation'],['1,482','completed']].map(([v,k])=>`<div class="metric"><b>${v}</b><span>${t(k)}</span></div>`).join('')}</div><p class="hint">${t('metricsnote')}</p><section class="section"><h2>${t('driverreason')}</h2><p>${t('driverreasontext')}</p><p class="muted small">${t('reasonnote')}</p>${b('request','request','small')}</section>`}
function render(){document.documentElement.lang=locale;document.title=`${t('workspace')} · ${t('demo')}`;document.getElementById('app').innerHTML=`<header class="nav"><div class="brand" aria-hidden="true">G</div><span class="nav-title">${t('workspace')}</span><span class="nav-path small">${t('path')}</span><span class="nav-spacer"></span><span class="small muted">${t('live')}</span><div class="locale" aria-label="Language / Ngôn ngữ"><button data-locale="en" aria-pressed="${locale==='en'}">EN</button><button data-locale="vi" aria-pressed="${locale==='vi'}">VI</button></div><div class="avatar" aria-label="Minh Anh">MA</div></header><div class="demo"><span class="grow">${t('demo')}</span><label class="row">${t('scenario')}<select id="scenario">${['success','error','conflict'].map(k=>`<option value="${k}" ${scenario===k?'selected':''}>${t(k)}</option>`).join('')}</select></label></div><main class="layout"><aside class="queue" aria-label="${t('queue')}"><div class="panel-head"><span>${t('queue')} <span class="muted small">(4)</span></span><span class="muted small">${t('history')}</span></div><div class="queue-filter"><input aria-label="${t('search')}" placeholder="${t('search')}" id="search"><div class="muted small" style="margin-top:10px">${claimed?t('mine'):t('available')}</div></div><div class="cases">${names.map((name,i)=>`<article class="case ${i===selectedCase?'selected':''}" data-case-card="${i}"><div class="row between"><span class="badge ${i===0?'amber':''}">P${i<2?1:2}</span><span class="hint">FR-${8921-i}</span><span class="hint">${i===0?t('sla'):'14:3'+i}</span></div><button class="case-title" data-case="${i}">${name}</button><div class="row between"><span class="plate">${plates[i]}</span><span class="hint">${i<2?'Quận 1':'Quận 3'}</span></div><div class="claim-actions">${i===selectedCase&&claimed?`${b('release','release','small')}`:`<button data-claim="${i}" class="${i===selectedCase?'primary':''}" ${busy?'disabled':''}>${busy&&i===selectedCase?t('claiming'):t('claim')}</button>`}</div>${i===selectedCase&&claimed?`<div class="hint" style="margin-top:6px;text-align:right">✓ ${t('owned')}</div>`:''}</article>`).join('')}</div><div class="queue-bottom">${t('queuefoot')}</div></aside><section class="center" aria-label="${t('workspace')}"><div class="joined"><div class="tabs" role="tablist" aria-label="${t('workspace')}">${tabs.map(k=>`<button role="tab" id="tab-${k}" aria-controls="panel-${k}" aria-selected="${k===tab}" tabindex="${k===tab?'0':'-1'}" data-tab="${k}">${t(k)}</button>`).join('')}</div><div class="content" role="tabpanel" id="panel-${tab}" aria-labelledby="tab-${tab}">${tab==='overview'?overview():tab==='finalization'?finalization():other()}${notice?`<div class="status" role="status">${t(notice)}${notice==='conflictmessage'?b('refresh','refresh','small'):''}</div>`:''}</div></div></section><aside class="copilot" aria-label="${t('copilot')}"><div class="panel-head"><div class="row"><div class="assistant-icon" aria-hidden="true">✧</div>${t('copilot')}</div><span class="badge green">${t('ready')}</span></div><div class="copilot-body"><div class="small"><strong>${t('assistant')}</strong><span class="muted" style="float:right">14:36</span></div><div class="assistant-note"><p>${t('copilottext')}</p></div><h3 class="muted small">${t('tools')}</h3><button class="tool" style="width:100%;text-align:left" data-tab="maps">↗ ${t('routecheck')}</button><button class="tool" style="width:100%;text-align:left" data-action="tool">↗ ${t('trafficcheck')}</button><button class="tool" style="width:100%;text-align:left" data-tab="driver">↗ ${t('statementcheck')}</button><p class="hint" style="margin-top:18px">${stage==='revealed'?t('aiconclusion'):t('copilotfoot')}</p></div><div class="composer"><label><span class="hidden">${t('ask')}</span><textarea id="copilot-input" aria-label="${t('ask')}" placeholder="${t('ask')}"></textarea></label><div class="row between"><span class="hint">${t('mock')}</span>${b('send','tool','primary small')}</div></div></aside></main>`;bind()}
function remember(){const n=document.querySelector('#independent-note');if(n)rationale.independent=n.value}
function changeTab(k,focus=false){remember();tab=k;notice='';render();if(focus)document.querySelector('#tab-'+k).focus()}
async function claim(i=selectedCase){if(busy)return;selectedCase=i;busy=true;notice='';render();await new Promise(r=>setTimeout(r,650));busy=false;if(scenario==='success'){claimed=true}else{claimed=false;notice=scenario==='error'?'networkmessage':'conflictmessage'}render()}
function bind(){document.querySelectorAll('[data-rationale]').forEach(el=>el.oninput=()=>rationale[el.dataset.rationale]=el.value);const decisionInput=document.querySelector('#decision');if(decisionInput)decisionInput.onchange=()=>decision=decisionInput.value;document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>changeTab(el.dataset.tab));document.querySelectorAll('[data-locale]').forEach(el=>el.onclick=()=>{remember();locale=el.dataset.locale;render()});document.querySelectorAll('[data-case]').forEach(el=>el.onclick=()=>{selectedCase=+el.dataset.case;claimed=false;stage='hidden';judgment='';rationale={};workflowValue='';decision='approve';notice='';render()});document.querySelectorAll('[data-claim]').forEach(el=>el.onclick=()=>claim(+el.dataset.claim));document.querySelector('#scenario').onchange=e=>scenario=e.target.value;document.querySelector('#search').oninput=e=>document.querySelectorAll('[data-case-card]').forEach(el=>el.hidden=!el.textContent.toLowerCase().includes(e.target.value.toLowerCase()));document.querySelectorAll('[name=judgment]').forEach(el=>el.onchange=()=>{judgment=el.value;document.querySelector('[data-action=submit-judgment]').disabled=false});document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{remember();const a=el.dataset.action;if(a==='claim')return claim();if(a==='release'){claimed=false;notice=''}if(a==='refresh')notice='';if(a==='reveal')stage='judgment';if(a==='submit-judgment'&&judgment){stage='revealed';notice=''}if(a==='workflow')editWorkflow=!editWorkflow;if(a==='save-workflow'){workflowValue=document.querySelector('#workflow-input').value;editWorkflow=false}if(a==='submit')notice='submission';if(a==='tool')notice='mockreply';if(a==='request')notice='requestsent';render()});document.querySelectorAll('[role=tab]').forEach(el=>el.onkeydown=e=>{let i=tabs.indexOf(tab);if(e.key==='ArrowRight')i=(i+1)%tabs.length;else if(e.key==='ArrowLeft')i=(i+tabs.length-1)%tabs.length;else if(e.key==='Home')i=0;else if(e.key==='End')i=tabs.length-1;else return;e.preventDefault();changeTab(tabs[i],true)})}
window.preview={copy,getState:()=>({locale,tab,stage,claimed,busy,judgment})};render();</script></body></html>
