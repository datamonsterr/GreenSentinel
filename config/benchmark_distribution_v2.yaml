# Opt-in overlay; v1 remains pinned to benchmark_distribution.yaml.
version: 0.4.0-benchmark-v2
speed:
  # Measured pooled Porto segment speeds INCLUDE STOPS. Interpolation between
  # measured p05/p95 and clipping for moving legs are explicit assumptions.
  per_leg_quantiles: {p05: 0.066717, p25: 1.005784, p50: 5.841227, p75: 11.174133, p95: 23.987436}
  moving_speed_clip_mps: [3.0, 24.0]
route:
  reach_dropoff: true
sampling:
  include_plan_endpoint: true
benchmark_v2:
  stress_share: 0.10
  porto_share: 0.20
  long_dialogue_share: 0.20
  long_dialogue_turns: 16
  gridlock_honest_share: 0.10
  gridlock_boundary_share: 0.03
  boundary_stop_s: 240
  # 3% is a synthetic 400-trip calibration fixture share, not real jam frequency.
  boundary_provenance: synthetic 400-trip historical calibration; controlled threshold fixtures
  # Boundary fixtures exclude stress, outages, unknown/poor accuracy and jitter.
  boundary_cadence_s: 10
  split_shares: {train: 0.70, validation: 0.15, test: 0.15}
